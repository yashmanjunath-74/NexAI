version: "3.9"

services:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nexai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexai_db
      POSTGRES_USER: nexai_user
      POSTGRES_PASSWORD: nexai_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexai_user -d nexai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nexai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexai_minio_user
      MINIO_ROOT_PASSWORD: nexai_minio_pass
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── Django Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: nexai_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./BackEnd:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://nexai_user:nexai_pass@db:5432/nexai_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: nexai_minio_user
      MINIO_SECRET_KEY: nexai_minio_pass
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: dev-secret-key-replace-in-production
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: nexai_celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./BackEnd:/app
    environment:
      DATABASE_URL: postgres://nexai_user:nexai_pass@db:5432/nexai_db
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: dev-secret-key-replace-in-production
    depends_on:
      - backend
      - redis

  # ─── Celery Beat (scheduler) ────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: nexai_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./BackEnd:/app
    environment:
      DATABASE_URL: postgres://nexai_user:nexai_pass@db:5432/nexai_db
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: dev-secret-key-replace-in-production
    depends_on:
      - backend
      - redis

  # ─── React Frontend (dev) ───────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: nexai_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_BASE_URL: ws://localhost:8000/ws
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
