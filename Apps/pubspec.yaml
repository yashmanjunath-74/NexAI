name: nexai_mobile
description: NexAI Examination Management System – Mobile Apps (Invigilator Scanner + Student Sandbox)
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^14.6.1

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── HTTP / API ───────────────────────────────────────────────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.1

  # ── Secure Storage ──────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Biometrics ──────────────────────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── Camera / Scanning ───────────────────────────────────────────────────────
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # ── Barcode / QR ────────────────────────────────────────────────────────────
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  # ── Geolocation ─────────────────────────────────────────────────────────────
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # ── WebSocket ───────────────────────────────────────────────────────────────
  web_socket_channel: ^3.0.1

  # ── UI ──────────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # ── Utils ───────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.5
  jwt_decoder: ^2.0.1
  connectivity_plus: ^6.1.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  retrofit_generator: ^9.1.2
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env
